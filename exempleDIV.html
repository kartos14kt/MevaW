<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduzir formatação de div</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0c19339c;
        }

        .conteudo {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #letra {
            white-space: pre-line;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
    <main class="conteudo">
        <div id="letra">Carregando...</div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("letras/letra1.txt")
                .then(response => response.text())
                .then(texto => {
                    document.getElementById("letra").textContent = texto
                })
            });
    </script>
</body>
</html>
