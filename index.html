<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Este é um site de musicas, onde você pode ouvir suas músicas favoritas e ler as letras.">
    <meta name="keywords" content="cantores, musicas">
    <meta name="author" content="Murilo Cézar">
    <title>MevaW - web player</title>
    <link rel="icon" href="icons/MevaW_LogoG.png" type="image/png">

    <link rel="stylesheet" href="principal.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>


<!-- TOPO: Logo, título e barra de pesquisa -->

<div class="topo">
    <div class="logo-topo">
        <img src="icons/MevaW_LogoG.png" class="logo-img" alt="MevaW">
        <span class="logo-nome">Meva<span class="logo-wave">W</span></span>
    </div>



    <div class="pesquisa-container">
        <div class="barra-pesquisa">
            <a href="#" class="botaoPesquisa">
                <img src="icons/lupagarai.svg" class="lupa" alt="Pesquisar" height="20" width="20">
            </a>
            <input type="text" class="pesquisa-input" id="campoBusca" placeholder="Pesquisar..." oninput="buscar(this.value)">
        </div>
        <div class="dropdown-resultados" id="dropdownResultados" style="display:none;">
        </div>
    </div>


    <div class="contatos">
        <a href="mailto:muriloczr1515@gmail.com">
            <img src="icons/mandaEmail.svg" id="contato-icon" alt="Email">
        </a>
        <a href="https://github.com/kartos14kt">
            <img src="icons/github.svg" id="contato-icon" alt="GitHub">
        </a>
    </div>
</div>


<!-- LAYOUT PRINCIPAL: Coluna esquerda (player) + Coluna direita (músicas) -->

<div class="layout">

    <div class="coluna-esquerda">
        
        <!-- Lista de artistas -->
        <div class="artistas">
            <h1 align="center">Artistas</h1>
        </div>

        <!-- Player de música -->
        <div class="extra">
            <div class="player">
                
                <!-- Capa da música -->
                <div class="top-player">
                    <img class="capa" draggable="false">
                </div>
                
                <!-- Título e artista -->
                <div class="info">
                    <div class="titulo" id="titulo">Nenhuma música</div>
                    <div class="artista" id="artista">aaaaaaa</div>
                </div>

                <!-- Barra de progresso da música -->
                <div class="barra">
                    <input type="range" value="0" min="0" max="100" class="progresso">
                </div>
                
                <!-- Tempo atual e duração -->
                <div class="tempo">
                    <span id="tempo-atual">0:00</span> <span id="duracao">0:00</span>
                </div>

                <!-- Botões de controle (anterior, play, próximo) -->
                <div class="controles">
                    <button class="btn-extra" id="btnLoop">
                        <img id="iconeLoop" src="icons/repetirOFF.png" draggable="false">
                    </button>

                    <button class="btn" id="anterior">
                        <img src="icons/skip_previous.png" class="btn_icon" draggable="false">
                    </button>

                    <button class="pause" id="play">
                        <img id="iconePlay" src="icons/tocando.png" class="btn_play" draggable="false">
                    </button>

                    <button class="btn" id="proximo">
                        <img src="icons/skip_next.png" class="btn_icon" draggable="false">
                    </button>

                    <button class="btn-extra" id="btnCurtir">
                        <img id="iconeCurtir" src="icons/semCurtir.png" draggable="false">
                    </button>
                </div>

                <!-- Botões extras (add playlist) -->
                <div class="extras">
                    <button class="btn-extra" id="btnPlaylist">
                        <img src="icons/playlistADD.png" draggable="false">
                    </button>
                </div>

                <!-- Barra de volume -->
                <div class="barra-volume">
                    <input type="range" value="100" min="0" max="100" class="volume">
                    <img class="icon-volume" src="" draggable="false">
                </div>

                <!-- Elemento de áudio (não visível) -->
                <audio id="audio"></audio>
            </div>
        </div>
    </div>

   
    <!-- COLUNA DIREITA: Abas + Lista de músicas -->
    <div class="sobre">
        <div class="abas-nav">
            <button class="aba-btn ativo" id="aba-playlists" onclick="trocarAba('playlists')">Playlists</button>
            <button class="aba-btn" id="aba-musicas" onclick="trocarAba('musicas')">Músicas</button>
            <button class="aba-btn" id="aba-letras" onclick="trocarAba('letras')">Letras</button>
        </div>

        <!-- Conteúdo principal: Lista de músicas do artista selecionado -->
        <div class="conteudo-principal">

            <!-- painel músicas -->
            <div id="painel-musicas" class="painel-aba">
                <div class="barraguia">
                    <div class="infoMusicas" id="numero"><b>N°</b></div>
                    <div class="infoMusicas" id="titulo"><b>Titulo</b></div>
                    <div class="infoMusicas" id="album"><b></b>Album</b></div>
                    <div class="infoMusicas" id="time"><b>Tempo</b></div>
                </div>
                <div id="listM" class="listM"></div>
            </div>
            
            <!-- painel playlists -->
            <div id="painel-playlists" class="painel-aba" style="display:none;">
                <p style="color: #aaa; padding: 20px;">Nenhuma playlist criada ainda.</p>
            </div>

            <div id="painel-letras" class="painel-aba" style="display:none;">
                <div id="letra" class="area-letra">Selecione uma música para ver a letra.</div>
            </div>

        </div>
    </div>
</div>

<script src="player.js"></script>
</body>
</html>
