<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Music Layout Teste</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    padding:15px;
}

.container{
    display:flex;
    flex-direction:column;
    gap:15px;
    height:100vh;
}

.pesquisa{
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pesquisa input{
    width:500px;
    max-width:80%;
    padding:12px 20px;
    border:none;
    border-radius:30px;
    background:#111;
    color:white;
    outline:none;
}

.conteudo{
    flex:1;
    display:grid;
    grid-template-columns:320px 1fr;
    gap:15px;
}

.coluna-esquerda{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.artistas{
    height:300px;
    background:#0b0b0b;
    border-radius:12px;
    padding:20px;
}

.player{
    flex:1;
    background:#0b0b0b;
    border-radius:12px;
    padding:20px;
}

.coluna-direita{
    background:#0b0b0b;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.abas{
    padding:15px;
    display:flex;
    gap:10px;
    border-bottom:1px solid #222;
}

.aba{
    padding:10px 20px;
    border-radius:20px;
    background:#111;
    cursor:pointer;
}

.aba.ativa{
    background:rgb(57,242,248);
    color:black;
    font-weight:bold;
}

.area-conteudo{
    flex:1;
    padding:20px;
    overflow:auto;
}

.card{
    background:#111;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="container">

    <div class="pesquisa">
        <input type="text" placeholder="Pesquisar músicas, artistas ou playlists">
    </div>

    <div class="conteudo">

        <div class="coluna-esquerda">

            <div class="artistas">
                <h2>Artistas</h2>
                <br>
                <p>Fabio Brazza</p>
                <p>Froid</p>
                <p>Outro artista</p>
            </div>

            <div class="player">
                <h2>Player</h2>
                <br>
                <p>Capa da música</p>
                <br><br>
                <p>Barra de progresso</p>
                <br><br>
                <p>Controles</p>
            </div>

        </div>

        <div class="coluna-direita">

            <div class="abas">
                <div class="aba">Playlists</div>
                <div class="aba ativa">Músicas</div>
            </div>

            <div class="area-conteudo">

                <div class="card">
                    Lamentável, Pt. III
                </div>

                <div class="card">
                    Rap Preto
                </div>

                <div class="card">
                    Só uma noite
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
